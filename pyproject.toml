[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "graphinstruct"
version = "0.1.0"
description = "Progressive Instruction-Driven LLM Graph Generation Benchmark"
requires-python = ">=3.10"
dependencies = [
    "networkx>=3.0",
    "numpy>=1.24",
    "tiktoken>=0.5",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
full = [
    "plotly>=5.0",
    "transformers>=4.30",
    "torch>=2.0",
    "torch_geometric>=2.0",
    "igraph>=0.11",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["graphinstruct*"]
