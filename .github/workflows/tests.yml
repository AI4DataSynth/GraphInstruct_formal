name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  unit-tests:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install core dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Run unit tests (core: D1 / D4 / D5 + parser + validators)
        env:
          KMP_DUPLICATE_LIB_OK: TRUE
          PYTHONIOENCODING: utf-8
        run: |
          python -m unittest discover -v -s tests -p "test_*.py" \
            --top-level-directory=. \
            2>&1 | tee test_output.log

      - name: Verify D5 robustness ablation runs
        if: matrix.python-version == '3.10'
        env:
          KMP_DUPLICATE_LIB_OK: TRUE
          PYTHONIOENCODING: utf-8
        continue-on-error: true
        run: |
          # Skip if no cached results yet (first push); otherwise run
          if ls results/quality/*.quality.json 1> /dev/null 2>&1; then
            python scripts/d5_robustness.py
          else
            echo "No cached quality.json files yet; skipping D5 ablation."
          fi
